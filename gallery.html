CENy8b" role="img" alt="FiestaSMP Screenshot"></a></div></div></div></div></div></div></div></div></div></div></section></div><script>
document.addEventListener("DOMContentLoaded", function() {
  // 1. Mobile navigation drawer toggle
  var hamburgerBtn = document.querySelector(".wTJ57c");
  var drawer = document.getElementById("yuynLe");
  var backdrop = document.querySelector(".BuY5Fd");

  function openDrawer() {
    if (drawer) {
      drawer.style.display = "block";
      setTimeout(function() { drawer.classList.add("jsnVQ"); }, 10);
    }
    if (backdrop) backdrop.classList.add("upKXGe");
  }

  function closeDrawer() {
    if (drawer) {
      drawer.classList.remove("jsnVQ");
      setTimeout(function() {
        if (!drawer.classList.contains("jsnVQ")) drawer.style.display = "none";
      }, 500);
    }
    if (backdrop) backdrop.classList.remove("upKXGe");
  }

  if (hamburgerBtn) {
    hamburgerBtn.addEventListener("click", function(e) {
      e.stopPropagation();
      if (drawer && drawer.classList.contains("jsnVQ")) closeDrawer();
      else openDrawer();
    });
  }

  if (backdrop) backdrop.addEventListener("click", closeDrawer);
  document.addEventListener("keydown", function(e) {
    if (e.key === "Escape") closeDrawer();
  });

  // 2. Click-to-copy for server IP addresses
  function showToast(msg) {
    var toast = document.querySelector(".fiesta-toast");
    if (!toast) {
      toast = document.createElement("div");
      toast.className = "fiesta-toast";
      document.body.appendChild(toast);
    }
    toast.textContent = msg;
    toast.classList.add("show");
    setTimeout(function() { toast.classList.remove("show"); }, 2800);
  }

  document.querySelectorAll(".copyable-ip").forEach(function(el) {
    el.addEventListener("click", function(e) {
      e.preventDefault();
      var ip = el.getAttribute("data-ip") || el.textContent.trim();
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(ip).then(function() {
          showToast("Copied " + ip + " to clipboard!");
        });
      } else {
        var ta = document.createElement("textarea");
        ta.value = ip;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        showToast("Copied " + ip + " to clipboard!");
      }
    });
  });
});
</script>
